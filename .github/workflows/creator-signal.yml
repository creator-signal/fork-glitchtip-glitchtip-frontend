name: Creator Signal frontend

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build-prod
      - uses: docker/setup-buildx-action@v3
      - name: Validate the combined-image build graph
        run: docker buildx bake --file docker-bake.hcl --print combined >/dev/null
      - name: Keep Creator Signal changes isolated
        run: |
          test -d src/creativesignal
          grep -Fq 'creator-signal-backend' Dockerfile.prod
          grep -Fq '284e8e65834ad4a4ad75f2c8d4be64e3f0e892f9' docker-bake.hcl
          ! grep -Fq 'registry.gitlab.com/glitchtip/glitchtip-backend' Dockerfile.prod

  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-prod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the combined runtime
        run: docker buildx bake --file docker-bake.hcl combined
