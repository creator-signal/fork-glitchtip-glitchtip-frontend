name: Creator Signal frontend

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build-prod
      - name: Keep Creator Signal changes isolated
        run: |
          test -d src/creativesignal
          grep -Fq 'ghcr.io/creator-signal/fork-glitchtip-glitchtip-backend:master' Dockerfile.prod
          ! grep -Fq 'registry.gitlab.com/glitchtip/glitchtip-backend' Dockerfile.prod

  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-prod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/creator-signal/fork-glitchtip-glitchtip-frontend
          tags: |
            type=raw,value=master,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FRONTEND_GLITCHTIP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
