name: Creator Signal frontend

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build-prod
      - uses: docker/setup-buildx-action@v3
      - name: Validate the combined-image build graph
        run: docker buildx bake --file docker-bake.hcl --print combined >/dev/null
      - name: Keep Creator Signal changes isolated
        run: |
          test -d src/creativesignal
          grep -Fq 'creator-signal-backend' Dockerfile.prod
          grep -Fq 'requirements-security.txt' Dockerfile.prod
          grep -Fq 'python -m pip check' Dockerfile.prod
          grep -Fq '/usr/local/lib/python3.14/site-packages/setuptools*' Dockerfile.prod
          grep -Fq 'aiohttp==3.14.3' requirements-security.txt
          grep -Fq 'cryptography==50.0.0' requirements-security.txt
          grep -Fq 'aiohttp.BasicAuth(' Dockerfile.prod
          grep -Fq 'expected exactly one allauth-async aiohttp basic-auth compatibility target' Dockerfile.prod
          grep -Fq 'e28f8f650bb63973e25815d1b08a1908266cf356' docker-bake.hcl
          ! grep -Fq 'registry.gitlab.com/glitchtip/glitchtip-backend' Dockerfile.prod

  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-prod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the combined runtime
        run: docker buildx bake --file docker-bake.hcl combined
      - name: Scan the immutable combined runtime
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/creator-signal/fork-glitchtip-glitchtip-frontend:sha-${{ github.sha }}
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
