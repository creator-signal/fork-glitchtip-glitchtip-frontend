<mat-drawer-container>
  <mat-drawer class="mat-elevation-z2" mode="side" opened>
    <nav>
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="./"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive
          #settingsLink="routerLinkActive"
          [activated]="settingsLink.isActive"
        >
          General Settings
        </a>
        <a
          mat-list-item
          routerLink="./projects"
          routerLinkActive
          #projectsSettingsLink="routerLinkActive"
          [activated]="projectsSettingsLink.isActive"
        >
          Projects
        </a>
        @if (billingEnabled()) {
          <a
            mat-list-item
            routerLink="./subscription"
            routerLinkActive
            #subscriptionLink="routerLinkActive"
            [activated]="subscriptionLink.isActive"
          >
            Subscription
          </a>
        }
        <a
          mat-list-item
          routerLink="./teams"
          routerLinkActive
          #teamsLink="routerLinkActive"
          [activated]="teamsLink.isActive"
        >
          Teams
        </a>
        <a
          mat-list-item
          routerLink="./members"
          routerLinkActive
          #membersLink="routerLinkActive"
          [activated]="membersLink.isActive"
        >
          Members
        </a>
      </mat-nav-list>
    </nav>
  </mat-drawer>
  <mat-drawer-content>
    @if (isLoggedIn()) {
      <gt-mobile-nav-toolbar
        [activeOrg]="activeOrganizationDetail()"
        (buttonClicked)="toggleSideNav()"
      ></gt-mobile-nav-toolbar>
    }
    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
