<gt-top-app-bar>
  <ng-container slot="left">
    <gt-list-title
      title="Uptime Monitors"
      [searchHits]="paginator()?.count"
    ></gt-list-title>
  </ng-container>

  <ng-container slot="right">
    <a
      id="add-monitor"
      mat-stroked-button
      color="primary"
      [routerLink]="['new']"
    >
      <mat-icon>add</mat-icon>
      Add monitor
    </a>
  </ng-container>
</gt-top-app-bar>
<section class="l-body l-body--full-width mat-elevation-z0">
  @if (monitors(); as monitors) {
    <div class="wrapper">
      <div class="table-container">
        <table mat-table [dataSource]="monitors" class="mat-elevation-z2">
          <ng-container matColumnDef="header-spacing">
            <!-- Empty cell for spacing -->
            <th mat-header-cell [attr.colspan]="3" *matHeaderCellDef> </th>
          </ng-container>
          <ng-container matColumnDef="pagination">
            <th mat-header-cell *matHeaderCellDef class="table-header__actions">
              <div>
                <gt-pagination-buttons
                  [paginator]="paginator()"
                  [loading]="loading()"
                />
              </div>
            </th>
          </ng-container>
          <ng-container matColumnDef="statusColor">
            <!-- Empty header cell -->
            <th mat-header-cell *matHeaderCellDef> </th>
            <td
              mat-cell
              *matCellDef="let monitor"
              class="status-color status-color--{{ monitor.isUp }}"
            ></td>
          </ng-container>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef i18n> Monitor </th>
            <td mat-cell *matCellDef="let monitor">
              <div class="name-and-url-container">
                <div (mouseover)="checkIfTooltipIsNecessary($event)">
                  <a
                    [matTooltip]="monitor.name"
                    class="table-group-label"
                    matTooltipPosition="above"
                    [matTooltipDisabled]="tooltipDisabled"
                    [routerLink]="[monitor.id]"
                    >{{ monitor.name }}</a
                  >
                </div>
                <div (mouseover)="checkIfTooltipIsNecessary($event)">
                  <a
                    href="{{ monitor.url }}"
                    target="_blank"
                    class="caption-text monitor-link"
                    [matTooltip]="monitor.url"
                    matTooltipPosition="above"
                    [matTooltipDisabled]="tooltipDisabled"
                    >{{ monitor.url }}
                  </a>
                </div>
              </div>
            </td>
          </ng-container>
          <ng-container matColumnDef="checkChart">
            <th mat-header-cell *matHeaderCellDef i18n> Recent checks </th>
            <td mat-cell *matCellDef="let monitor" class="chart-container">
              <div class="monitor-chart">
                <gt-monitor-chart [data]="monitor.checks"></gt-monitor-chart>
              </div>
            </td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef i18n> Status </th>
            <td
              mat-cell
              *matCellDef="let monitor"
            >
              @if (monitor.isUp) {
                <span>Up</span>
              }
              @if (monitor.isUp === false) {
                <span>Down</span>
              }
              @if (monitor.lastChange) {
                {{ monitor.lastChange | timeFor }}
              }
            </td>
          </ng-container>
          <tr
            mat-header-row
            *matHeaderRowDef="['header-spacing', 'pagination']; sticky: true"
            class="table-header"
            [attr.colspan]="2"
          ></tr>
          <tr
            mat-header-row
            class="table-header"
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            class="monitor-row"
          ></tr>
        </table>
      </div>
    </div>
  }
</section>
