<section class="l-body">
  <gt-back-link backLinkText="View monitor details" />
  <gt-detail-header [title]="['Update Monitor', null]">
    <button
      mat-icon-button
      class="medium-icon-button"
      id="delete-monitor"
      (click)="delete()"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </gt-detail-header>
  @if (monitor(); as monitor) {
    <gt-monitor-form
      [monitorSettings]="monitor"
      [loading]="loading() === true"
      [formError]="error()"
      (formSubmitted)="submit($event)"
    ></gt-monitor-form>
  }
</section>
